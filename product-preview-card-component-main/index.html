<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">

  <title>Frontend Mentor | Product preview card component</title>
</head>

<body>
  <main>
    <div class="card">
    <img src="./images/image-product-desktop.jpg" alt="Perfume Gabrielle Essence Eau De Parfum">
    <div class="product-details-card">
      <p>Perfume</p>

      <h1>Gabrielle Essence Eau De Parfum</h1>

      <p>A floral, solar and voluptuous interpretation composed by Olivier Polge,
        Perfumer-Creator for the House of CHANEL.</p>

      <div class="product-card-sale">
      <h2>$149.99</h2>
      <p class="product-card-old">$169.99</p>
      </div> 

      <button class="product-cart-button">
      <img src="./images/icon-cart.svg" alt="carrito de compras">
      Add to Cart</button>
      </div>
    </div>
  </main>

</body>

</html>
